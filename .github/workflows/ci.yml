name: CI

on:
  push:
    branches: [main]
  pull_request:

# Acoes fixadas por SHA (nao por tag): uma tag pode ser movida para codigo malicioso.
# Nunca usar pull_request_target: rodaria codigo de fork com acesso a segredos.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # gitleaks precisa do historico inteiro
          persist-credentials: false # o token nao fica salvo no disco do runner
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - run: pytest -q
      - name: Segredos e dados pessoais (regras do projeto)
        run: python scripts/check_secrets.py
      - name: Segredos no historico inteiro (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
